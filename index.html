<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unit Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body class="bg-slate-50 text-gray-900 min-h-screen">
<div class="max-w-lg mx-auto px-4 py-10">

  <header class="flex items-center gap-2 mb-6">
    <span id="header-icon-wrap" class="flex items-center justify-center w-8 h-8 rounded-full transition-colors">
      <i data-lucide="ruler" class="w-4 h-4"></i>
    </span>
    <h1 class="text-lg font-semibold text-gray-800">Unit Converter</h1>
  </header>

  <!-- Category tabs -->
  <div id="tabs" class="relative inline-flex rounded-md border border-gray-200 bg-white p-1 mb-4"></div>

  <!-- Currency status banner (currency tab only) -->
  <div id="currency-banner" class="hidden mb-4"></div>

  <!-- Input row -->
  <div class="flex gap-2 mb-8">
    <input
      id="value-input"
      type="number"
      min="0"
      inputmode="decimal"
      class="flex-1 min-w-0 rounded-md border border-gray-300 bg-white px-3 py-2 text-base font-medium tabular-nums shadow-sm focus:outline-none focus:ring-2 transition"
      value="1"
    />

    <!-- Combobox -->
    <div id="combobox" class="relative">
      <button
        id="combobox-trigger"
        type="button"
        class="flex items-center justify-between gap-2 w-36 rounded-md border border-gray-300 bg-white px-3 py-2 text-sm shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 transition"
      >
        <span id="combobox-label" class="truncate"></span>
        <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 shrink-0"></i>
      </button>

      <div
        id="combobox-panel"
        class="hidden absolute right-0 z-10 mt-1 w-56 rounded-md border border-gray-200 bg-white shadow-lg"
      >
        <div class="flex items-center gap-2 border-b border-gray-100 px-3 py-2">
          <i data-lucide="search" class="w-4 h-4 text-gray-400 shrink-0"></i>
          <input
            id="combobox-search"
            type="text"
            placeholder="Search unit..."
            class="w-full text-sm outline-none placeholder:text-gray-400"
          />
        </div>
        <ul id="combobox-list" class="max-h-60 overflow-y-auto py-1 text-sm"></ul>
      </div>
    </div>
  </div>

  <!-- Output cards -->
  <div id="cards" class="grid grid-cols-2 gap-3"></div>

</div>

<script>
  const CATEGORIES = {
    area: {
      label: "Area",
      icon: "square",
      base: "m2",
      units: {
        m2:    { label: "m²",    name: "Square meter",      factor: 1 },
        km2:   { label: "km²",   name: "Square kilometer",  factor: 1000000 },
        ha:    { label: "ha",    name: "Hectare",           factor: 10000 },
        acre:  { label: "acre",  name: "Acre",              factor: 4046.8564224 },
        rai:   { label: "rai",   name: "Rai",               factor: 1600 },
        tsubo: { label: "tsubo", name: "Tsubo",             factor: 400 / 121 },
      },
    },
    length: {
      label: "Length",
      icon: "move-horizontal",
      base: "m",
      units: {
        mm: { label: "mm", name: "Millimeter", factor: 0.001 },
        cm: { label: "cm", name: "Centimeter", factor: 0.01 },
        m:  { label: "m",  name: "Meter",      factor: 1 },
        km: { label: "km", name: "Kilometer",  factor: 1000 },
        in: { label: "in", name: "Inch",       factor: 0.0254 },
        ft: { label: "ft", name: "Foot",       factor: 0.3048 },
        yd: { label: "yd", name: "Yard",       factor: 0.9144 },
        mi: { label: "mi", name: "Mile",       factor: 1609.344 },
      },
    },
    weight: {
      label: "Weight",
      icon: "weight",
      base: "g",
      units: {
        mg: { label: "mg", name: "Milligram",  factor: 0.001 },
        g:  { label: "g",  name: "Gram",       factor: 1 },
        kg: { label: "kg", name: "Kilogram",   factor: 1000 },
        t:  { label: "t",  name: "Metric ton", factor: 1000000 },
        oz: { label: "oz", name: "Ounce",      factor: 28.3495231 },
        lb: { label: "lb", name: "Pound",      factor: 453.59237 },
        st: { label: "st", name: "Stone",      factor: 6350.29318 },
      },
    },
    currency: {
      label: "Currency",
      icon: "banknote",
      base: "usd",
      units: {
        usd: { label: "USD", name: "US Dollar",     factor: 1 },
        gbp: { label: "GBP", name: "British Pound", factor: null },
        jpy: { label: "JPY", name: "Japanese Yen",  factor: null },
        thb: { label: "THB", name: "Thai Baht",     factor: null },
      },
    },
  };

  const CATEGORY_COLORS = {
    area:     { text: "teal-700",   bg: "teal-50",   border: "teal-500",   ring: "teal-300"   },
    length:   { text: "blue-700",   bg: "blue-50",   border: "blue-500",   ring: "blue-300"   },
    weight:   { text: "amber-700",  bg: "amber-50",  border: "amber-500",  ring: "amber-300"  },
    currency: { text: "violet-700", bg: "violet-50",  border: "violet-500", ring: "violet-300" },
  };

  const CURRENCY_CACHE_KEY = "currencyRates";
  let currencyState = "idle"; // idle | loading | live | cached | error
  let currencyRatesDate = null;

  let activeCategory = "area";
  let activeUnit = CATEGORIES[activeCategory].base;

  const tabsEl = document.getElementById("tabs");
  const valueInput = document.getElementById("value-input");
  const comboboxTrigger = document.getElementById("combobox-trigger");
  const comboboxLabel = document.getElementById("combobox-label");
  const comboboxPanel = document.getElementById("combobox-panel");
  const comboboxSearch = document.getElementById("combobox-search");
  const comboboxList = document.getElementById("combobox-list");
  const cardsEl = document.getElementById("cards");
  const currencyBannerEl = document.getElementById("currency-banner");
  const headerIconWrap = document.getElementById("header-icon-wrap");

  function applyCategoryTheme(key) {
    const c = CATEGORY_COLORS[key];
    valueInput.className =
      `flex-1 min-w-0 rounded-md border border-gray-300 bg-white px-3 py-2 text-base font-medium tabular-nums shadow-sm focus:outline-none focus:ring-2 focus:ring-${c.ring} focus:border-${c.border} transition`;
    comboboxTrigger.className =
      `flex items-center justify-between gap-2 w-36 rounded-md border border-gray-300 bg-white px-3 py-2 text-sm shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-${c.ring} focus:border-${c.border} transition`;
    headerIconWrap.className =
      `flex items-center justify-center w-8 h-8 rounded-full bg-${c.bg} text-${c.text} transition-colors`;
  }

  function formatNumber(n) {
    if (!isFinite(n)) return "—";
    const abs = Math.abs(n);
    if (abs !== 0 && (abs < 0.000001 || abs >= 1e15)) {
      return n.toExponential(4);
    }
    return n.toLocaleString(undefined, { maximumSignificantDigits: 6 });
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function loadCachedRates() {
    try {
      const raw = localStorage.getItem(CURRENCY_CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  function saveCachedRates(entry) {
    try {
      localStorage.setItem(CURRENCY_CACHE_KEY, JSON.stringify(entry));
    } catch {}
  }

  function applyCurrencyRates(rates) {
    const u = CATEGORIES.currency.units;
    u.usd.factor = 1;
    u.gbp.factor = 1 / rates.gbp;
    u.jpy.factor = 1 / rates.jpy;
    u.thb.factor = 1 / rates.thb;
  }

  function fetchCurrencyRates(force = false) {
    const today = todayStr();
    const cached = loadCachedRates();

    if (!force && cached && cached.fetchedOn === today) {
      applyCurrencyRates(cached.rates);
      currencyState = "live";
      currencyRatesDate = cached.date;
      renderCurrencyBanner();
      renderCards();
      return;
    }

    currencyState = "loading";
    renderCurrencyBanner();
    renderCards();

    fetch("https://api.frankfurter.dev/v1/latest?from=USD&to=GBP,JPY,THB")
      .then((res) => {
        if (!res.ok) throw new Error("Request failed");
        return res.json();
      })
      .then((data) => {
        const rates = { usd: 1, gbp: data.rates.GBP, jpy: data.rates.JPY, thb: data.rates.THB };
        applyCurrencyRates(rates);
        currencyState = "live";
        currencyRatesDate = data.date;
        saveCachedRates({ fetchedOn: today, date: data.date, rates });
      })
      .catch(() => {
        if (cached) {
          applyCurrencyRates(cached.rates);
          currencyState = "cached";
          currencyRatesDate = cached.date;
        } else {
          currencyState = "error";
        }
      })
      .finally(() => {
        renderCurrencyBanner();
        renderCards();
      });
  }

  function renderCurrencyBanner() {
    if (activeCategory !== "currency") {
      currencyBannerEl.classList.add("hidden");
      return;
    }
    currencyBannerEl.classList.remove("hidden");

    if (currencyState === "loading") {
      currencyBannerEl.innerHTML = `
        <div class="flex items-center gap-2 rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-600">
          <i data-lucide="loader-2" class="w-4 h-4 animate-spin shrink-0"></i>
          <span>Fetching live rates…</span>
        </div>`;
    } else if (currencyState === "live") {
      currencyBannerEl.innerHTML = `
        <div class="flex items-center gap-2 rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-600">
          <span class="w-2 h-2 rounded-full bg-green-500 shrink-0"></span>
          <span>Rates as of ${currencyRatesDate} (USD base) · Frankfurter API</span>
        </div>`;
    } else if (currencyState === "cached") {
      currencyBannerEl.innerHTML = `
        <div class="flex items-center gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">
          <i data-lucide="triangle-alert" class="w-4 h-4 shrink-0"></i>
          <span>Showing cached rates from ${currencyRatesDate} — couldn't refresh</span>
        </div>`;
    } else if (currencyState === "error") {
      currencyBannerEl.innerHTML = `
        <div class="flex items-center justify-between gap-2 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-800">
          <div class="flex items-center gap-2">
            <i data-lucide="circle-alert" class="w-4 h-4 shrink-0"></i>
            <span>Couldn't load exchange rates</span>
          </div>
          <button id="currency-retry" type="button" class="rounded-md bg-rose-600 px-2.5 py-1 text-xs font-medium text-white hover:bg-rose-700">Retry</button>
        </div>`;
      document.getElementById("currency-retry").addEventListener("click", () => fetchCurrencyRates(true));
    } else {
      currencyBannerEl.innerHTML = "";
    }

    if (window.lucide) lucide.createIcons();
  }

  let indicatorBgClass = null;

  function updateTabsActive() {
    const indicator = document.getElementById("tabs-indicator");
    const activeColor = CATEGORY_COLORS[activeCategory];
    const newBgClass = `bg-${activeColor.bg}`;
    if (indicatorBgClass) indicator.classList.remove(indicatorBgClass);
    indicator.classList.add(newBgClass);
    indicatorBgClass = newBgClass;

    tabsEl.querySelectorAll("button[data-key]").forEach((btn) => {
      const key = btn.dataset.key;
      const isActive = key === activeCategory;
      const c = CATEGORY_COLORS[key];
      btn.className =
        "relative z-10 px-3 py-1.5 text-sm rounded-sm transition-colors " +
        (isActive ? `text-${c.text} font-medium` : "text-gray-600 hover:text-gray-900");
      if (isActive) {
        indicator.style.left = btn.offsetLeft + "px";
        indicator.style.width = btn.offsetWidth + "px";
      }
    });
  }

  function buildTabs() {
    tabsEl.innerHTML = '<div id="tabs-indicator" class="absolute top-1 bottom-1 rounded-sm"></div>';
    Object.entries(CATEGORIES).forEach(([key, cat]) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.key = key;
      btn.textContent = cat.label;
      btn.addEventListener("click", () => {
        if (activeCategory === key) return;
        activeCategory = key;
        activeUnit = CATEGORIES[activeCategory].base;
        updateTabsActive();
        renderCombobox();
        renderCurrencyBanner();
        applyCategoryTheme(activeCategory);
        renderCards();
        if (key === "currency" && currencyState === "idle") {
          fetchCurrencyRates();
        }
      });
      tabsEl.appendChild(btn);
    });

    updateTabsActive();
    // Enable the slide/fade transition only after the initial position is set,
    // so the pill doesn't animate in from the top-left corner on page load.
    requestAnimationFrame(() => {
      document.getElementById("tabs-indicator").classList.add("transition-all", "duration-300", "ease-out");
    });
    window.addEventListener("resize", updateTabsActive);
  }

  function renderCombobox(filter = "") {
    const cat = CATEGORIES[activeCategory];
    comboboxLabel.textContent = cat.units[activeUnit].label;

    comboboxList.innerHTML = "";
    const q = filter.trim().toLowerCase();
    Object.entries(cat.units)
      .filter(([key, u]) => u.label.toLowerCase().includes(q) || key.toLowerCase().includes(q))
      .forEach(([key, u]) => {
        const li = document.createElement("li");
        const isSelected = key === activeUnit;
        li.className =
          "flex items-center justify-between gap-2 px-3 py-1.5 cursor-pointer hover:bg-gray-100 " +
          (isSelected ? "text-gray-900 font-medium" : "text-gray-700");
        const labelWrap = document.createElement("span");
        labelWrap.className = "flex items-baseline gap-1.5 min-w-0";
        const abbr = document.createElement("span");
        abbr.textContent = u.label;
        const name = document.createElement("span");
        name.textContent = u.name;
        name.className = "text-xs text-slate-500 truncate";
        labelWrap.appendChild(abbr);
        labelWrap.appendChild(name);
        li.appendChild(labelWrap);
        if (isSelected) {
          const icon = document.createElement("i");
          icon.setAttribute("data-lucide", "check");
          icon.className = `w-4 h-4 text-${CATEGORY_COLORS[activeCategory].text} shrink-0`;
          li.appendChild(icon);
        }
        li.addEventListener("click", () => {
          activeUnit = key;
          closeCombobox();
          renderCombobox();
          renderCards();
        });
        comboboxList.appendChild(li);
      });

    if (window.lucide) lucide.createIcons();
  }

  function openCombobox() {
    comboboxPanel.classList.remove("hidden");
    comboboxSearch.value = "";
    renderCombobox();
    comboboxSearch.focus();
  }

  function closeCombobox() {
    comboboxPanel.classList.add("hidden");
  }

  function toggleCombobox() {
    if (comboboxPanel.classList.contains("hidden")) openCombobox();
    else closeCombobox();
  }

  function renderCards() {
    const cat = CATEGORIES[activeCategory];
    const factorsReady = Object.values(cat.units).every((u) => typeof u.factor === "number");

    if (!factorsReady) {
      if (activeCategory === "currency" && currencyState === "error") {
        cardsEl.innerHTML = "";
      } else {
        cardsEl.innerHTML = Array.from({ length: 3 })
          .map(
            () => `
          <div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm animate-pulse">
            <div class="h-3 w-16 bg-gray-200 rounded mb-3"></div>
            <div class="h-5 w-20 bg-gray-200 rounded"></div>
          </div>`
          )
          .join("");
      }
      return;
    }

    const raw = parseFloat(valueInput.value);
    const value = isNaN(raw) ? 0 : raw;
    const baseValue = value * cat.units[activeUnit].factor;
    const c = CATEGORY_COLORS[activeCategory];

    cardsEl.innerHTML = "";
    Object.entries(cat.units)
      .filter(([key]) => key !== activeUnit)
      .forEach(([key, u]) => {
        const converted = baseValue / u.factor;
        const card = document.createElement("div");
        card.className =
          `rounded-lg border border-gray-200 border-t-4 border-t-${c.border} bg-${c.bg} p-4 shadow-sm transition duration-300 hover:shadow-md hover:-translate-y-0.5`;
        card.innerHTML = `
          <div class="flex items-baseline gap-1.5 mb-1">
            <span class="text-xs uppercase tracking-wide font-semibold text-${c.text}">${u.label}</span>
            <span class="text-xs text-slate-500 truncate">${u.name}</span>
          </div>
          <div class="text-xl font-bold text-slate-900 tabular-nums break-all">${formatNumber(converted)}</div>
        `;
        cardsEl.appendChild(card);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => card.classList.replace(`bg-${c.bg}`, "bg-white"));
        });
      });
  }

  // Events
  valueInput.addEventListener("input", renderCards);
  comboboxTrigger.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleCombobox();
  });
  comboboxSearch.addEventListener("input", (e) => renderCombobox(e.target.value));
  document.addEventListener("click", (e) => {
    if (!document.getElementById("combobox").contains(e.target)) closeCombobox();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeCombobox();
  });

  // Init
  buildTabs();
  renderCombobox();
  renderCurrencyBanner();
  applyCategoryTheme(activeCategory);
  renderCards();
  if (window.lucide) lucide.createIcons();
</script>

</body>
</html>
